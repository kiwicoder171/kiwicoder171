  <circle cx="864" cy="220" r="3.2" fill="#0a0c10" stroke="#262b36" stroke-width="1"/>
  <line x1="862.2" y1="220" x2="865.8" y2="220" stroke="#64748b" stroke-width="0.8"/>

  <text x="36" y="38" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing="0.16em" fill="#64748b">METALLURGICAL COMPOSITION // CODEBASE DISTRIBUTION</text>
  <text x="844" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing="0.12em" fill="#94a3b8">VERIFIED TELEMETRY</text>
  <line x1="36" y1="50" x2="844" y2="50" stroke="#262b36" stroke-width="1"/>

  
    <g transform="translate(36, 70)">
      <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="800" letter-spacing="0.08em" fill="#f1f5f9">TYPESCRIPT</text>
      <text x="155" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#94a3b8">75%</text>
      <rect x="205" y="3" width="360" height="12" rx="3" fill="#181b22" stroke="#262b36" stroke-width="1"/>
      <rect x="206" y="4" width="270" height="10" rx="2" fill="url(#st-mercury)" class="grow"/>
      <text x="582" y="13.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#64748b">Primary Architecture · Full-Stack &amp; Game Loops</text>
    </g>
    <g transform="translate(36, 108)">
      <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="800" letter-spacing="0.08em" fill="#f1f5f9">HTML5 / CANVAS</text>
      <text x="155" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#94a3b8">19%</text>
      <rect x="205" y="3" width="360" height="12" rx="3" fill="#181b22" stroke="#262b36" stroke-width="1"/>
      <rect x="206" y="4" width="68" height="10" rx="2" fill="url(#st-mercury)" class="grow"/>
      <text x="582" y="13.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#64748b">Interactive Surfaces · Museum &amp; Board Layouts</text>
    </g>
    <g transform="translate(36, 146)">
      <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="800" letter-spacing="0.08em" fill="#f1f5f9">PYTHON</text>
      <text x="155" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#94a3b8">4%</text>
      <rect x="205" y="3" width="360" height="12" rx="3" fill="#181b22" stroke="#262b36" stroke-width="1"/>
      <rect x="206" y="4" width="28" height="10" rx="2" fill="url(#st-mercury)" class="grow"/>
      <text x="582" y="13.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#64748b">Market Scanners · Data Automation &amp; Tooling</text>
    </g>
    <g transform="translate(36, 184)">
      <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="800" letter-spacing="0.08em" fill="#f1f5f9">JAVASCRIPT</text>
      <text x="155" y="14" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#94a3b8">2%</text>
      <rect x="205" y="3" width="360" height="12" rx="3" fill="#181b22" stroke="#262b36" stroke-width="1"/>
      <rect x="206" y="4" width="18" height="10" rx="2" fill="url(#st-mercury)" class="grow"/>
      <text x="582" y="13.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#64748b">Browser Userscripts · Tampermonkey Runtime</text>
