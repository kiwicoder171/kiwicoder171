      <text x="16" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#f1f5f9">227 <tspan font-size="13" font-weight="600" fill="#94a3b8">COMMITS</tspan></text>
