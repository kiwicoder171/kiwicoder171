    <text x="2" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" fill="#64748b">Architecting tactile web platforms, real-time board game</text>
    <text x="2" y="69" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" fill="#64748b">engines, and high-utility tactical operations suites.</text>
  </g>

