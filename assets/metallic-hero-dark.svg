    <text x="24" y="3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0.12em" fill="#f1f5f9">SYS.ONLINE</text>
    <text x="134" y="3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" letter-spacing="0.16em" fill="#64748b">SPEC // TI-0171 // REV 4.2</text>
  </g>

