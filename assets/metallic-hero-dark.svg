  <line x1="862.2" y1="16" x2="865.8" y2="16" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="16" cy="304" r="3.2" fill="#0a0c10" stroke="#262b36" stroke-width="1"/>
  <line x1="14.2" y1="304" x2="17.8" y2="304" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="864" cy="304" r="3.2" fill="#0a0c10" stroke="#262b36" stroke-width="1"/>
  <line x1="862.2" y1="304" x2="865.8" y2="304" stroke="#64748b" stroke-width="0.8"/>

