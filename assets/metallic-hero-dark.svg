<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="KIWICODER171 — Minimal Metallic Engineering Profile">
  <style>
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .sweep { animation: sweep 8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-920px); } 60%, 100% { transform: translateX(920px); } }
    .term-scroll { animation: tscroll 14s linear infinite; }
    @keyframes tscroll { to { transform: translateY(-152px); } }
    .spin-slow { transform-origin: 816px 68px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .sweep, .term-scroll, .spin-slow { animation: none !important; }
    }
  </style>
  
  <defs>
    <linearGradient id="hero-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161920"/>
      <stop offset="50%" stop-color="#0f1116"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="hero-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="hero-chrome-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="hero-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="hero-sheen" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-mercury" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="hero-brushed" width="40" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="40" y2="1" stroke="#ffffff" stroke-opacity="0.018" stroke-width="1"/>
      <line x1="0" y1="3" x2="40" y2="3" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="hero-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#64748b" fill-opacity="0.22"/>
    </pattern>
  </defs>

