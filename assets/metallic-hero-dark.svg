    <g clip-path="url(#term-clip)" transform="translate(0, 26)">
      <g class="term-scroll">
        <text x="16" y="18" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#94a3b8">$ git log --oneline -n 6</text><text x="16" y="37" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#e2e8f0">a8f3d12  boardgamezaa   feat(engine): real-time board session state sync</text><text x="16" y="56" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#cbd5e1">c49e07b  tornops        feat(ops): wire Faction Banking &amp; Crimes 2.0</text><text x="16" y="75" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#e2e8f0">71b92a4  linport        style(gallery): fluid exhibition transitions</text><text x="16" y="94" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#cbd5e1">e03c819  todolist       feat(hub): shared couple task state sync</text><text x="16" y="113" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#e2e8f0">94d110e  odyssey        feat(combat): deterministic Hades state loop</text><text x="16" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#cbd5e1">3f88a1c  torn-core      feat(calc): zero-waste med &amp; travel matrix</text><text x="16" y="151" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#10b981">$ npm run typecheck &amp;&amp; npm run build                     [OK 0.42s]</text><text x="16" y="170" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#94a3b8">$ git log --oneline -n 6</text><text x="16" y="189" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#e2e8f0">a8f3d12  boardgamezaa   feat(engine): real-time board session state sync</text><text x="16" y="208" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#cbd5e1">c49e07b  tornops        feat(ops): wire Faction Banking &amp; Crimes 2.0</text><text x="16" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#e2e8f0">71b92a4  linport        style(gallery): fluid exhibition transitions</text><text x="16" y="246" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#cbd5e1">e03c819  todolist       feat(hub): shared couple task state sync</text><text x="16" y="265" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#e2e8f0">94d110e  odyssey        feat(combat): deterministic Hades state loop</text><text x="16" y="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#cbd5e1">3f88a1c  torn-core      feat(calc): zero-waste med &amp; travel matrix</text><text x="16" y="303" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#10b981">$ npm run typecheck &amp;&amp; npm run build                     [OK 0.42s]</text>
      </g>
    </g>
