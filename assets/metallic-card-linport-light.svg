<svg xmlns="http://www.w3.org/2000/svg" width="430" height="198" viewBox="0 0 430 198" role="img" aria-label="linport">
  <style>
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
  
  <defs>
    <linearGradient id="c03-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
