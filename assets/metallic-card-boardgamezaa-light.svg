<svg xmlns="http://www.w3.org/2000/svg" width="430" height="198" viewBox="0 0 430 198" role="img" aria-label="boardgamezaa">
  <style>
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
  
  <defs>
    <linearGradient id="c01-chassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="c01-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="c01-chrome-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="c01-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="c01-sheen" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c01-mercury" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="c01-brushed" width="40" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="40" y2="1" stroke="#ffffff" stroke-opacity="0.018" stroke-width="1"/>
      <line x1="0" y1="3" x2="40" y2="3" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="c01-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#64748b" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="428" height="196" rx="12" fill="url(#c01-chassis)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="2" y="2" width="426" height="194" rx="11" fill="url(#c01-brushed)"/>
  <line x1="20" y1="2" x2="410" y2="2" stroke="url(#c01-rim)" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="3.2" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="14.2" y1="16" x2="17.8" y2="16" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="414" cy="16" r="3.2" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="412.2" y1="16" x2="415.8" y2="16" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="16" cy="182" r="3.2" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="14.2" y1="182" x2="17.8" y2="182" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="414" cy="182" r="3.2" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="412.2" y1="182" x2="415.8" y2="182" stroke="#64748b" stroke-width="0.8"/>

  <text x="26" y="36" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0.16em" fill="#64748b">MODULE 01 // INTERACTIVE ENGINE</text>
  
        <g transform="translate(382, 42)" opacity="0.85">
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#1e293b" stroke-width="1.5"/>
          <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" fill="none" stroke="#64748b" stroke-width="1"/>
          <circle cx="0" cy="0" r="2" fill="#059669" class="pulse"/>
        </g>

  <text x="26" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em" fill="#0f172a">boardgamezaa</text>
  <text x="26" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#334155">Interactive digital board game web platform and</text>
  <text x="26" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#334155">real-time multiplayer session engine.</text>

  <rect x="26" y="148" width="86" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="69.0" y="164" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#334155">TYPESCRIPT</text><rect x="120.0" y="148" width="93" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="166.4" y="164" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#334155">GAME ENGINE</text><rect x="220.8" y="148" width="59" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="250.2" y="164" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#334155">WEB UI</text>

  <text x="402" y="164" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#64748b">↗</text>
</svg>